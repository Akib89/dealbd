name: dealbd

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dealbd}
      MYSQL_USER: ${DB_USERNAME:-dealbd}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set a DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a MYSQL_ROOT_PASSWORD in .env}
    ports:
      # Host access (e.g. MySQL Workbench): localhost:3307; inside Docker use db:3306.
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    image: dealbd-php:local
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_CONNECTION: mysql
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      db:
        condition: service_healthy

  bootstrap:
    profiles: [tools]
    build: .
    image: dealbd-php:local
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: ["sh", "/var/www/html/docker/bootstrap.sh"]

  worker:
    profiles: [jobs]
    build: .
    image: dealbd-php:local
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=2", "--timeout=90"]
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_CONNECTION: mysql
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    profiles: [jobs]
    build: .
    image: dealbd-php:local
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_CONNECTION: mysql
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
